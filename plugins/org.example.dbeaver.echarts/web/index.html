<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DBeaver ECharts</title>
  <link rel="stylesheet" href="css/plugin.css">
</head>
<body>
  <main class="app-shell">
    <section class="toolbar" aria-label="Chart controls">
      <label>
        <span>View</span>
        <select id="viewMode">
          <option value="chart">Chart</option>
          <option value="dashboard">Dashboard</option>
        </select>
      </label>
      <label>
        <span>Chart</span>
        <select id="chartType">
          <option value="line">Line</option>
          <option value="area">Area</option>
          <option value="bar">Bar</option>
          <option value="scatter">Scatter</option>
          <option value="pie">Pie</option>
          <option value="gauge">Gauge</option>
          <option value="radar">Radar</option>
          <option value="heatmap">Heatmap</option>
          <option value="boxplot">Boxplot</option>
          <option value="treemap">Treemap</option>
          <option value="funnel">Funnel</option>
          <option value="map">Map</option>
        </select>
      </label>
      <label>
        <span>X / category</span>
        <select id="xField"></select>
      </label>
      <label>
        <span>Y / value</span>
        <select id="yField"></select>
      </label>
      <details id="seriesPicker" class="toolbar-popover">
        <summary><span>Series</span><strong id="seriesCount">1</strong></summary>
        <div id="seriesOptions" class="popover-panel" aria-label="Y series and axes"></div>
      </details>
      <details class="toolbar-popover">
        <summary><span>Analysis</span></summary>
        <div class="popover-panel analysis-options">
          <label><input id="markLine" type="checkbox"> Mean line</label>
          <label><input id="markArea" type="checkbox"> Min/max area</label>
          <label><input id="visualMap" type="checkbox"> Visual scale</label>
        </div>
      </details>
      <label>
        <span>Renderer</span>
        <select id="renderer">
          <option value="canvas">Canvas</option>
          <option value="svg">SVG</option>
        </select>
      </label>
      <div id="dashboardActions" class="dashboard-actions" hidden>
        <input id="dashboardTitle" type="text" maxlength="200" aria-label="Dashboard title" placeholder="Dashboard title">
        <button id="addWidget" type="button">Add widget</button>
        <button id="clearFilters" type="button">Clear filters</button>
        <button id="importDashboard" type="button">Import</button>
        <button id="exportDashboard" type="button">Export</button>
        <button id="saveDashboard" type="button">Save dashboard</button>
        <button id="openDashboard" type="button">Open dashboard</button>
        <button id="refreshDashboard" type="button">Refresh all</button>
        <button id="reviewDashboardSql" type="button">Review SQL</button>
        <button id="stopDashboard" type="button" disabled>Stop queries</button>
      </div>
      <span id="status" role="status"></span>
    </section>

    <section class="workspace">
      <section id="chartView" class="chart-wrap">
        <div id="chart" aria-label="ECharts result-set visualization"></div>
        <div id="empty" class="message" hidden></div>
      </section>
      <section id="dashboardView" class="dashboard-workspace" hidden>
        <div id="dashboardFilters" class="dashboard-filters" hidden></div>
        <div id="dashboardGrid" class="dashboard-grid"></div>
        <div id="dashboardEmpty" class="message" hidden></div>
      </section>
    </section>

  </main>

  <dialog id="queryReview" class="query-review" aria-labelledby="queryReviewTitle">
    <h2 id="queryReviewTitle">Review dashboard queries</h2>
    <p>These queries will run on the connections shown below. Review them before running this dashboard. Approval lasts until you close the dashboard or change its SQL or connection.</p>
    <div id="queryReviewSources"></div>
    <div class="query-review-actions">
      <button id="runReviewedQueries" type="button">Run queries</button>
      <button id="cancelQueryReview" type="button">Cancel</button>
    </div>
  </dialog>

  <script src="js/echarts.min.js"></script>
  <script src="js/world-map.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/dashboard-layout.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/chart.js"></script>
</body>
</html>
