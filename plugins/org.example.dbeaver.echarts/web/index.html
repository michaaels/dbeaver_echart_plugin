<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DBeaver ECharts</title>
  <link rel="stylesheet" href="css/plugin.css">
</head>
<body>
  <main class="app-shell">
    <section class="toolbar" aria-label="Chart controls">
      <label class="view-control">
        <span>View</span>
        <select id="viewMode">
          <option value="chart">Chart</option>
          <option value="dashboard">Dashboard</option>
        </select>
      </label>
      <label class="chart-control">
        <span>Chart</span>
        <select id="chartType">
          <option value="line">Line</option>
          <option value="area">Area</option>
          <option value="bar">Bar</option>
          <option value="scatter">Scatter</option>
          <option value="pie">Pie</option>
          <option value="gauge">Gauge</option>
          <option value="radar">Radar</option>
          <option value="heatmap">Heatmap</option>
          <option value="boxplot">Boxplot</option>
          <option value="treemap">Treemap</option>
          <option value="funnel">Funnel</option>
          <option value="map">Map</option>
        </select>
      </label>
      <label class="chart-control">
        <span>X / category</span>
        <select id="xField"></select>
      </label>
      <label class="chart-control">
        <span>Y / value</span>
        <select id="yField"></select>
      </label>
      <details id="seriesPicker" class="toolbar-popover chart-control">
        <summary><span>Series</span><strong id="seriesCount">1</strong></summary>
        <div id="seriesOptions" class="popover-panel" aria-label="Y series and axes"></div>
      </details>
      <details class="toolbar-popover chart-control">
        <summary><span>Analysis</span></summary>
        <div class="popover-panel analysis-options">
          <label><input id="markLine" type="checkbox"> Mean line</label>
          <label><input id="markArea" type="checkbox"> Min/max area</label>
          <label><input id="visualMap" type="checkbox"> Visual scale</label>
        </div>
      </details>
      <div id="dashboardActions" class="dashboard-actions" hidden>
        <div class="dashboard-heading">
          <input id="dashboardTitle" type="text" maxlength="200" aria-label="Dashboard title" title="Edit dashboard title" placeholder="Dashboard title">
          <span id="dashboardSummary" class="dashboard-summary"></span>
        </div>
        <div class="dashboard-commandbar" role="group" aria-label="Dashboard actions">
          <button id="addWidget" class="primary-action" type="button">+ Add widget</button>
          <button id="saveDashboard" type="button">Save dashboard</button>
          <span class="command-divider" aria-hidden="true"></span>
          <button id="refreshDashboard" type="button">Refresh all</button>
          <button id="reviewDashboardSql" type="button">Review SQL</button>
          <button id="stopDashboard" type="button" disabled>Stop queries</button>
          <button id="clearFilters" type="button">Clear filters</button>
          <details id="dashboardFiles" class="toolbar-popover dashboard-files">
            <summary>Files <span aria-hidden="true">⌄</span></summary>
            <div class="popover-panel file-actions">
              <button id="openDashboard" type="button">Open dashboard…</button>
              <button id="importDashboard" type="button">Import dashboard…</button>
              <button id="exportDashboard" type="button">Export dashboard…</button>
            </div>
          </details>
        </div>
      </div>
      <div class="toolbar-auxiliary">
      <details id="displayOptions" class="toolbar-popover display-options">
        <summary>Display <span aria-hidden="true">⌄</span></summary>
        <div class="popover-panel">
          <label><span>Renderer</span><select id="renderer">
            <option value="canvas">Canvas</option>
            <option value="svg">SVG</option>
          </select></label>
        </div>
      </details>
      <button id="openReportDesigner" type="button">Report Designer</button>
      </div>
      <span id="status" role="status"></span>
    </section>

    <section class="workspace">
      <section id="chartView" class="chart-wrap">
        <div id="chart" aria-label="ECharts result-set visualization"></div>
        <div id="empty" class="message" hidden></div>
      </section>
      <section id="dashboardView" class="dashboard-workspace" hidden>
        <div id="dashboardFilters" class="dashboard-filters" hidden></div>
        <div id="dashboardGrid" class="dashboard-grid"></div>
        <div id="dashboardEmpty" class="message" hidden></div>
      </section>
    </section>

  </main>

  <dialog id="queryReview" class="query-review" aria-labelledby="queryReviewTitle">
    <h2 id="queryReviewTitle">Review dashboard queries</h2>
    <p>These queries will run on the connections shown below. Review them before running this dashboard. Approval lasts until you close the dashboard or change its SQL or connection.</p>
    <div id="queryReviewSources"></div>
    <div class="query-review-actions">
      <button id="runReviewedQueries" type="button">Run queries</button>
      <button id="cancelQueryReview" type="button">Cancel</button>
    </div>
  </dialog>

  <dialog id="widgetEditor" class="widget-editor" aria-labelledby="widgetEditorHeading">
    <h2 id="widgetEditorHeading">Edit widget</h2>
    <div class="widget-editor-fields">
      <label>Title<input id="widgetEditorName" type="text" maxlength="200"></label>
      <label>Connection<select id="widgetEditorConnection"></select></label>
    </div>
    <label class="widget-editor-query">SQL for this chart
      <textarea id="widgetEditorSql" spellcheck="false" aria-label="Widget SQL" placeholder="SELECT category, value FROM ..."></textarea>
    </label>
    <div class="widget-editor-query-actions">
      <button id="widgetEditorRun" type="button">Run preview</button>
      <button id="widgetEditorStop" type="button" disabled>Stop preview</button>
      <span id="widgetEditorStatus" role="status"></span>
    </div>
    <p id="widgetEditorError" role="alert" hidden></p>
    <div class="widget-editor-fields">
      <label>Chart<select id="widgetEditorType"></select></label>
      <label>X / category<select id="widgetEditorCategory"></select></label>
      <label>Refresh<select id="widgetEditorRefresh">
        <option value="manual:0">Manual</option>
        <option value="interval:30">Every 30 s</option>
        <option value="interval:60">Every minute</option>
        <option value="interval:300">Every 5 min</option>
      </select></label>
    </div>
    <fieldset class="widget-editor-series"><legend>Y series and axes</legend><div id="widgetEditorSeries"></div></fieldset>
    <div class="widget-editor-marks">
      <label><input id="widgetEditorMean" type="checkbox"> Mean line</label>
      <label><input id="widgetEditorRange" type="checkbox"> Min/max area</label>
      <label><input id="widgetEditorScale" type="checkbox"> Visual scale</label>
    </div>
    <div id="widgetEditorPreview" class="widget-editor-preview" aria-label="Chart preview"></div>
    <div class="widget-editor-data"><table id="widgetEditorData" aria-label="Preview result rows"></table></div>
    <div class="widget-editor-actions">
      <button id="widgetEditorSave" type="button">Apply widget</button>
      <button id="widgetEditorCancel" type="button">Cancel</button>
    </div>
  </dialog>

  <script src="js/echarts.min.js"></script>
  <script src="js/world-map.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/dashboard-layout.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/widget-editor.js"></script>
  <script src="js/chart.js"></script>
</body>
</html>
