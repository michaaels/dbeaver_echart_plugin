name: P2 package

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-package:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Select Java 21
        run: |
          if (!$env:JAVA_HOME_21_X64) { throw 'Runner has no Java 21 JDK' }
          "JAVA_HOME=$env:JAVA_HOME_21_X64" >> $env:GITHUB_ENV
          "ECHARTS_COMPILER_JDK=$env:JAVA_HOME_21_X64" >> $env:GITHUB_ENV
          "$env:JAVA_HOME_21_X64/bin" >> $env:GITHUB_PATH
      - name: Download and verify pinned toolchain
        run: ./scripts/prepare-p2-target.ps1
      - name: Install pinned test dependencies
        run: |
          New-Item -ItemType Directory -Force -Path .dev/browser-tests | Out-Null
          Copy-Item -LiteralPath dev/ci/browser/package.json,dev/ci/browser/package-lock.json -Destination .dev/browser-tests
          npm ci --prefix .dev/browser-tests --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Test dependency installation failed' }
      - name: Validate sources, query controls and chart geometry
        run: |
          ./scripts/validate.ps1 -DBeaverPlugins .dev/ci-target/dbeaver/dbeaver/plugins
          node scripts/test-chart-labels.js
          if ($LASTEXITCODE -ne 0) { throw 'Chart label geometry tests failed' }
          node scripts/test-chart-catalog.js
          if ($LASTEXITCODE -ne 0) { throw 'Chart catalog rendering and export tests failed' }
          node scripts/test-dashboard-browser.js
          if ($LASTEXITCODE -ne 0) { throw 'Dashboard authoring tests failed' }
          node scripts/test-dashboard-resize.js
          if ($LASTEXITCODE -ne 0) { throw 'Dashboard UX and edge resize tests failed' }
          node scripts/test-report-designer.js
          if ($LASTEXITCODE -ne 0) { throw 'Report Designer authoring and offline export tests failed' }
          node scripts/test-report-interactions.js
          if ($LASTEXITCODE -ne 0) { throw 'Report mouse, sections and lifecycle tests failed' }
          python scripts/test-report-eml.py
          if ($LASTEXITCODE -ne 0) { throw 'Report draft MIME tests failed' }
      - name: Build previous and current P2 packages
        run: |
          $baseline = Get-Content -Raw dev/ci/upgrade-baseline.json | ConvertFrom-Json
          git worktree add --detach .dev/upgrade-baseline $baseline.commit
          if ($LASTEXITCODE -ne 0) { throw 'Baseline checkout failed' }
          $dbeaver = [IO.Path]::GetFullPath('.dev/ci-target/dbeaver/dbeaver')
          $eclipse = [IO.Path]::GetFullPath('.dev/ci-target/eclipse/eclipse')
          node .dev/upgrade-baseline/scripts/build-p2.js --dbeaver $dbeaver --eclipse $eclipse --jdk $env:JAVA_HOME --output .dev/previous-package
          if ($LASTEXITCODE -ne 0) { throw 'Previous package build failed' }
          node scripts/build-p2.js --dbeaver $dbeaver --eclipse $eclipse --jdk $env:JAVA_HOME
          if ($LASTEXITCODE -ne 0) { throw 'Current package build failed' }
      - name: Install, upgrade, uninstall and reinstall in clean DBeaver
        run: |
          $previous = @(Get-ChildItem .dev/previous-package -Filter '*.zip')
          $current = @(Get-ChildItem dist -Filter '*.zip')
          if ($previous.Count -ne 1 -or $current.Count -ne 1) { throw 'Expected one archive per build' }
          ./scripts/test-p2-install.ps1 -DistributionZip .dev/ci-target/dbeaver-ce-26.2.2-windows-x86_64.zip -PreviousRepositoryZip $previous[0].FullName -RepositoryZip $current[0].FullName -Destination .dev/ci-installed
          Copy-Item -LiteralPath .dev/ci-installed/p2-test-result.json -Destination dist/p2-test-result.json
      - name: Upload verified installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dbeaver-echarts-p2-windows-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.sha256
            dist/*/build-info.json
            dist/p2-test-result.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p2-diagnostics-${{ github.run_id }}
          include-hidden-files: true
          path: |
            .dev/p2-build-*/workspace/.metadata/.log
            .dev/ci-installed/dbeaver/configuration/*.log
            .dev/ci-installed/director-workspace/.metadata/.log
          if-no-files-found: ignore
          retention-days: 7

  linux-package:
    needs: windows-package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dbeaver-echarts-p2-windows-${{ github.sha }}
          path: .dev/linux-installer
      - name: Prepare Linux DBeaver and browser dependencies
        run: |
          mkdir -p .dev/linux-target .dev/browser-tests
          curl --fail --location --retry 3 https://dbeaver.io/files/26.2.2/dbeaver-ce-26.2.2-linux-x86_64.tar.gz -o .dev/linux-target/dbeaver.tar.gz
          echo '27b39a79a69ec70f9f95c6ee3b68514fcc7677acef93287e8df8e13cc53384d5  .dev/linux-target/dbeaver.tar.gz' | sha256sum --check
          tar -xzf .dev/linux-target/dbeaver.tar.gz -C .dev/linux-target
          cp dev/ci/browser/package*.json .dev/browser-tests/
          npm ci --prefix .dev/browser-tests --ignore-scripts --no-audit --no-fund
          node .dev/browser-tests/node_modules/playwright/cli.js install --with-deps chromium webkit
          sudo apt-get install -y libwebkit2gtk-4.1-0 xvfb
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
      - name: Install the shared P2 artifact in Linux DBeaver
        run: |
          product="$PWD/.dev/linux-target/dbeaver"
          archive=$(find .dev/linux-installer -name 'dbeaver-echarts-*.zip' -print -quit)
          test -n "$archive"
          unzip -q "$archive" -d .dev/linux-repository
          launcher=$(find "$product/plugins" -name 'org.eclipse.equinox.launcher_*.jar' -print -quit)
          "$product/jre/bin/java" --enable-native-access=ALL-UNNAMED -jar "$launcher" -nosplash -consoleLog -install "$product" -configuration "$product/configuration" -data "$PWD/.dev/linux-director-workspace" -eclipse.keyring "$PWD/.dev/linux-keyring" -application org.eclipse.equinox.p2.director -repository "file:$PWD/.dev/linux-repository" -installIU org.example.dbeaver.echarts.feature.feature.group
      - name: Validate Linux APIs, Chromium, WebKit and the installed registry
        shell: bash
        run: bash scripts/test-linux.sh "$PWD/.dev/linux-target/dbeaver" 2>&1 | tee .dev/linux-tests.log
      - name: Upload Linux test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dbeaver-echarts-linux-tests-${{ github.sha }}
          include-hidden-files: true
          path: |
            .dev/linux-tests.log
            .dev/screenshots/
            .dev/reports/
            .dev/registry-test-*/configuration/*.log
          if-no-files-found: ignore
          retention-days: 14
